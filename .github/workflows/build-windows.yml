# Builds the Windows MSI installer and the portable package on GitHub's
# Windows runners.
# - Push to master (a merged version branch) or by hand (Actions > Build Windows
#   packages > Run workflow): the files are attached to the run as
#   'DocFetcher-Windows' (GitHub login needed, kept 90 days).
# - Tag 'release-<version>' (e.g. release-3.2, matching current-version.txt):
#   additionally a public GitHub release 'DocFetcher <version>' with the MSI, the
#   portable zip and the notes of that version from the changelog. Create the
#   tag on Gitea; the push mirror brings it here (a tag made only on GitHub
#   would be removed by the mirror).
# Gitea uses .gitea/workflows/build-windows.yml instead of this file.

name: Build Windows packages

on:
  push:
    branches: [master]
    tags: ["release-*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: ./dev/ci/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DocFetcher-Windows
          path: |
            build/*.msi
            build/*-Portable.zip
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/release-')
        id: notes
        shell: pwsh
        run: |
          ./dev/ci/release-notes.ps1 -Tag "${{ github.ref_name }}"
          "version=$((Get-Content current-version.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v2
        with:
          name: DocFetcher ${{ steps.notes.outputs.version }}
          body_path: build/release-notes.md
          files: |
            build/*.msi
            build/*-Portable.zip
          fail_on_unmatched_files: true
