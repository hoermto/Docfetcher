# Builds the Windows MSI installer and the portable package on GitHub's
# Windows runners. Runs on every push to master (a merged version branch) and
# by hand: Actions > Build Windows packages > Run workflow.
# The files are attached to the run as 'DocFetcher-Windows' (kept 90 days).
# Gitea uses .gitea/workflows/build-windows.yml instead of this file.

name: Build Windows packages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: ./dev/ci/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DocFetcher-Windows
          path: |
            build/*.msi
            build/*-Portable.zip
          if-no-files-found: error
